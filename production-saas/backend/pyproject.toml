[project]
name = "atlas-saas-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
 "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
 "pyjwt>=2.9,<3", "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.9",
 "redis>=5,<6", "stripe>=11,<12", "email-validator>=2.2,<3",
 "opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2",
 "opentelemetry-instrumentation-fastapi>=0.48b0,<1", "opentelemetry-exporter-otlp>=1.27,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1", "ruff>=0.6,<1"]
[tool.pytest.ini_options]
pythonpath=["."]
[tool.ruff]
line-length=100
